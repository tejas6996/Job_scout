# JobScout — India / freshers configuration.
# Single source of truth for locations, keywords, thresholds and source
# toggles. Nothing in server/src should hardcode these values directly —
# read them via server/src/config/loadConfig.js instead.

locations:
  # Every key a source/city string can normalize to. Add new aliases here,
  # not in code — server/src/location.js just reads this table.
  canonical:
    bengaluru: [bengaluru, bangalore, blr, "bangalore urban", "bengaluru urban"]
    gurugram: [gurugram, gurgaon]
    delhi_ncr: [delhi, "new delhi", ncr, "delhi ncr", "national capital region"]
    mumbai: [mumbai, bombay]
    hyderabad: [hyderabad, secunderabad]
    pune: [pune]
    chennai: [chennai, madras]
    noida: [noida, "greater noida"]
    kolkata: [kolkata, calcutta]
    ahmedabad: [ahmedabad]
    coimbatore: [coimbatore]
    remote_india: ["remote india", "remote - india", "remote-india", "pan india remote"]
    hybrid: [hybrid]

  # Hard filter: a job whose canonical location isn't in this list is
  # dropped entirely (server/src/pipeline.js), regardless of source. Empty
  # or omitted = no restriction (any canonical location from the table
  # above is allowed). This is what actually scopes the dashboard to a
  # region — `priority` below only affects ranking among what's allowed.
  scope: [bengaluru]

  # Cities boosted in fit scoring (server/src/scoring.js), among whatever
  # `scope` allows through. Order doesn't matter — all listed cities get an
  # equal boost, unlisted ones don't.
  priority: [bengaluru]

roles:
  # Stage A treats a posting as in-scope only if the title/description hits
  # one of these keywords. Kept broad on purpose — the experience filter
  # (not this list) is what does the fresher/senior separation.
  include_keywords:
    - software engineer
    - swe
    - developer
    - programmer
    - data analyst
    - data engineer
    - business analyst
    - bi analyst
    - business intelligence
    - analytics engineer
    - machine learning
    - ml engineer
    - ai engineer
    - data science
    - qa engineer
    - test engineer
    - sde
    - full stack
    - frontend
    - backend
    - devops
    - support engineer
    - graduate engineer trainee
    - management trainee
    - campus hire

  # Hard-exclude if any of these appear in the title (word-bounded matching
  # is applied in code — this list is just the raw terms).
  exclude_title_keywords:
    - senior
    - sr.
    - lead
    - principal
    - staff
    - architect
    - manager
    - head of
    - director
    - "ii"
    - "iii"

experience:
  max_years: 2
  # Hard filter (mirrors locations.scope below): only these role_type values
  # pass the experience gate (server/src/filters/index.js), even if a
  # posting is otherwise a confident 0-2yr match. Also narrows the
  # fresher-qualifier terms server/src/sources/roleQuery.js appends to the
  # JSearch fetch query, so the fetch itself is targeted at these role
  # types, not just the downstream filter. Empty or omitted = no
  # restriction (internship/apprenticeship/trainee/full_time_entry all
  # eligible). Valid values: internship, apprenticeship, trainee, full_time_entry.
  active_role_types: [internship, apprenticeship]
  # Phrases that count as a fresher-eligible role type regardless of a
  # missing/ambiguous years figure.
  fresher_role_signals:
    - fresher
    - freshers only
    - intern
    - internship
    - apprentice
    - apprenticeship
    - trainee
    - graduate engineer trainee
    - get
    - management trainee
    - campus hire
    - new grad
    - entry level
    - entry-level
    - junior

freshness:
  # Postings older than this are dropped outright (server/src/pipeline.js).
  # Tightened from 21->10 on request: only recent postings, nothing stale.
  max_age_days: 10

sources:
  # Toggle a provider on/off without touching code. Providers without a
  # public free API (naukri, internshala, unstop, linkedin_india,
  # indeed_india, wellfound_india, instahyre, hirist, foundit) are wired
  # into the provider registry but disabled by default until a scraping or
  # paid-API implementation lands — see MIGRATION.md.
  jobicy: true
  remotive: true
  adzuna: true
  jsearch: true
  ats_boards: true
  company_pages: true
  naukri: false
  internshala: false
  unstop: false
  foundit: false
  instahyre: false
  hirist: false
  linkedin_india: false
  indeed_india: false
  wellfound_india: false

  # Company boards for the ats_boards provider — Greenhouse, Lever, Ashby,
  # SmartRecruiters and Workable all publish a free, keyless, per-company
  # JSON feed (see server/src/sources/atsBoards.js). Add any India-hiring
  # company here; every token below was verified live (200 response + real
  # Bengaluru postings) before being added, not guessed at.
  ats_companies:
    - { type: greenhouse, token: groww }
    - { type: greenhouse, token: postman }
    - { type: lever, token: cred }
    - { type: lever, token: Sprinto }
    - { type: lever, token: hevodata }
    - { type: lever, token: acceldata }
    - { type: lever, token: stable-money1 }
    - { type: lever, token: mindtickle }
    - { type: lever, token: smart-working-solutions }
    - { type: lever, token: weekdayworks }
    - { type: ashby, token: "flagright.com" }
    - { type: ashby, token: bespokelabs }
    - { type: ashby, token: oneapp }
    - { type: ashby, token: josys }
    - { type: ashby, token: broccoli }
    - { type: ashby, token: pebl }
    - { type: ashby, token: lambda }
    - { type: smartrecruiters, token: Freshworks }
    - { type: smartrecruiters, token: ph7 }
    - { type: smartrecruiters, token: T-SystemsICTIndiaPvtLtd1 }
    - { type: workable, token: apna }
    - { type: workable, token: astrome-technologies }
    - { type: workable, token: blue-machines-ai }
    - { type: workable, token: maxwellenergy }

  # URLs for the company_pages provider (server/src/sources/companyPages.js)
  # — each page is read for embedded schema.org JobPosting structured data
  # (the same markup Google requires for Google for Jobs), NOT scraped raw
  # HTML. This is for companies with a custom-built career page that isn't
  # on one of the ATS platforms above. `company` is an optional override if
  # the page's own hiringOrganization.name is missing or wrong.
  #
  # Empty by default — add a company here (one line, same pattern as
  # ats_companies) only after confirming its career page actually publishes
  # JobPosting JSON-LD (view-source and search for
  # `application/ld+json` + `"@type":"JobPosting"`); a page without it
  # silently contributes 0 postings, which isn't a bug, just no data to find.
  company_page_urls: []

rate_limits:
  # Per-source concurrent request cap + backoff used by server/src/util/fetchJson.js.
  max_concurrent_per_source: 3
  retry_attempts: 3
  retry_base_delay_ms: 1000
  # Adzuna's results_per_page (no fixed total-request cap, safe to raise
  # directly). JSearch has a fixed *total* request budget instead (see
  # source_refresh_minutes.jsearch below) so its num_pages stays hardcoded
  # at 1 in jsearch.js regardless of this value — raise this only after
  # confirming with whoever owns the API keys, since it spends more quota
  # per request.
  results_per_source: 50
  # How often the server proactively re-polls sources in the background
  # (server/src/pool.js) and refreshes the in-memory job pool, independent
  # of whether anyone is currently loading the dashboard. This is the
  # default cadence — override per-source below for sources with a tighter
  # quota than Adzuna/Greenhouse/Lever's generous daily budgets.
  background_refresh_minutes: 15

  # Per-source overrides (minutes) for sources whose default cadence would
  # exhaust a limited quota. A source with no entry here uses
  # background_refresh_minutes. JSearch's key has a fixed *total* request
  # cap (not a daily one) — at the default 15-min cadence x 2 priority
  # cities/cycle it would burn ~192 req/day, exhausting a 200-request quota
  # in under a day. At 480 min (8h) x 2 cities = ~6 req/day, a 171-request
  # remaining balance lasts ~28 days, comfortably past a ~20-day reset
  # window even accounting for retries.
  source_refresh_minutes:
    jsearch: 480
    # Company career pages have no quota to protect, but hitting someone
    # else's site every 15 minutes is impolite for no real benefit — career
    # pages don't change that often. Hourly is a reasonable default.
    company_pages: 60

llm:
  # Stage B classifier — only invoked when Stage A can't decide.
  provider: gemini
  model: gemini-2.5-flash-lite
